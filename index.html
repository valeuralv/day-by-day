<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Day by Day"><meta name="mobile-web-app-capable" content="yes"><title>Day by Day ✿ — Updated Preview</title>
<style>
:root{--bg:#f7f4f7;--card:#fff;--ink:#29252e;--muted:#89818f;--line:#eee8ef;--pink:#f8c9df;--green:#cfe2d2;--yellow:#f9e7b8;--purple:#17151a;--shadow:0 5px 18px #30243a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px calc(98px + env(safe-area-inset-bottom))}.app{max-width:540px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 16px;gap:8px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}.brand{font-size:28px;letter-spacing:-.04em;font-weight:800;margin:5px 0 3px;white-space:nowrap}.date{font-size:13px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:7px}.pill{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 11px;font-size:14px;font-weight:750;white-space:nowrap}.round-btn{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:19px;box-shadow:var(--shadow);color:var(--ink)}.arc-card{padding:0 0 9px;text-align:center}.arc-wrap{position:relative;width:min(100%,340px);height:190px;margin:0 auto}.arc-svg{width:100%;height:100%;overflow:visible}.arc-track{fill:none;stroke:#e8e2eb;stroke-width:12;stroke-linecap:round}.arc-progress{fill:none;stroke:#17151a;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .35s}.mascot-img{width:100%;height:100%;object-fit:contain;display:block}.monkey{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);width:116px;height:105px;transition:transform .25s}.monkey.celebrate{animation:hop .65s ease 2;filter:drop-shadow(0 0 8px #f4c86e)}.monkey.celebrate:after{content:'✦  ✧  ✦';position:absolute;inset:-18px -28px auto;text-align:center;color:#e8b95d;font-size:19px;letter-spacing:10px;pointer-events:none}.monkey.sleepy{filter:saturate(.75) brightness(.97)}.monkey.sleepy{filter:saturate(.8)}@keyframes hop{0%,100%{transform:translate(-50%,-50%)}45%{transform:translate(-50%,-78%) rotate(-5deg)}}.arc-caption{font-size:14px;font-weight:500;margin-top:-3px}.arc-caption strong{font-weight:800}.arc-labels{display:flex;justify-content:space-between;width:min(100%,340px);margin:-3px auto 0;padding:0 13px;color:var(--muted);font-size:11px}.arc-caption span{color:var(--muted);font-weight:500}.habits-card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:13px;margin:12px 0 14px;box-shadow:var(--shadow)}.habit-list{display:grid;gap:8px}.habit{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border:1px solid #f0ebf2;border-radius:18px;background:#fff;color:var(--ink);min-height:66px}.habit.done .habit-name{text-decoration:line-through;color:#89818f}.habit-icon{width:52px;height:52px;flex:0 0 52px;border-radius:15px;background:#e9e8e9;display:grid;place-items:center;font-size:25px;overflow:hidden}.habit-icon img{width:100%;height:100%;object-fit:cover}.habit-icon svg{width:30px;height:30px}.habit-icon{border:0;padding:0;cursor:pointer}.habit-photo-input{display:none}.habit-name{font-size:14px;font-weight:600;flex:1}.check{width:30px;height:30px;flex:0 0 30px;border:1.6px solid #8d8493;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px}.done .check{background:#17151a;border-color:#17151a}.stats{background:#fff;border:1px solid var(--line);border-radius:23px;padding:15px 17px;display:flex;align-items:center;gap:13px;margin:0 0 14px;box-shadow:var(--shadow)}.stat-symbol{width:54px;height:54px;border-radius:16px;background:#faf3f7;display:grid;place-items:center;font-size:29px}.stat-title{font-size:14px;font-weight:750}.stat-value{font-size:28px;font-weight:850;letter-spacing:-.5px;margin-top:1px}.stat-sub{font-size:11px;color:var(--muted)}.calendar-card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.cal-title{font-size:17px;font-weight:800}.month-actions{display:flex;align-items:center;gap:7px}.month-label{font-size:13px;color:var(--muted)}.nav{border:0;background:#f8f5f8;border-radius:50%;width:29px;height:29px;font-size:20px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}.day{aspect-ratio:1;border:1px solid transparent;background:#f5f2f5;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--ink);padding:0}.day.empty{background:transparent}.day.today{border-color:#9985a7;font-weight:800}.day.complete{background:var(--pink)}.day.partial-high{background:var(--green)}.day.partial-low{background:var(--yellow)}.day.selected{box-shadow:inset 0 0 0 2px #8e789b}.legend{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap;margin-top:13px;font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:4px}.swatch{width:10px;height:10px;border-radius:50%;display:inline-block}.footer{text-align:center;color:#99929c;font-size:11px;letter-spacing:.035em;padding:2px 0 20px}.selected-info{font-size:11px;color:var(--muted);margin-top:10px}.bottom-nav{position:fixed;z-index:5;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),520px);height:70px;border:1px solid #e4dce7;border-radius:40px;background:#ffffffed;backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;box-shadow:0 8px 25px #34243c12}.nav-item{border:0;background:transparent;display:grid;justify-items:center;gap:3px;color:#302b33;font-size:11px}.nav-item b{font-size:23px;line-height:24px}.plus{width:52px;height:52px;border-radius:50%;border:2px solid #2e2932;background:#fff;font-size:31px;line-height:1;display:grid;place-items:center;padding:0;justify-self:center}.bottom-nav #plusBtn{display:grid;place-items:center;justify-self:center;align-self:center;width:64px;height:64px;padding:0}.toast{position:fixed;z-index:9;left:50%;top:18px;transform:translateX(-50%);background:#29252e;color:#fff;border-radius:18px;padding:12px 17px;font-size:13px;box-shadow:var(--shadow);text-align:center;max-width:90vw}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#20162666;z-index:10;display:grid;place-items:end center;padding:12px}.modal-box{background:#fff;width:min(100%,520px);border-radius:25px;padding:20px;max-height:85vh;overflow:auto}.modal-title{font-size:20px;font-weight:850;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px}.edit-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.edit-row input[type=text]{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px}.edit-row input[type=file]{display:none}.edit-row .mini{border:0;background:#f5eff7;border-radius:9px;padding:8px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:750;background:#29252e;color:#fff}.btn.secondary{background:#f1eaf4;color:#55465f}.tiny{font-size:11px;color:var(--muted);line-height:1.5}.task-remove{border:0;background:transparent;font-size:20px;color:#8a808f}@media(min-width:560px){body{padding-top:20px}.modal{place-items:center}}
</style></head><body><main class="app">

</main><div id="toast" class="toast hidden"></div><div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="modal-box"><h2 class="modal-title" id="modalTitle">Edit daily habits</h2><div id="modalBody"></div><div class="modal-actions"><button class="btn secondary" id="cancelModal">Cancel</button><button class="btn" id="saveModal">Save</button></div></div></div>
<script>(()=>{
const KEY='dayByDayHabitTracker_v1';const defaults=[{id:'move',name:'Move your body',emoji:'🧘🏻‍♀️'},{id:'water',name:'Drink enough water',emoji:'💧'},{id:'read',name:'Read 10 pages',emoji:'📚'},{id:'study',name:'Reach my study goal',emoji:'🩺'},{id:'routine',name:'Night routine',emoji:'🌙'}];let state={appName:'Day by Day ✿',habits:defaults,records:{},gems:0,extras:{},rewarded:{},history:{},dayPhotos:{}};let viewYear,viewMonth,selectedDate=localDateKey(new Date()),celebrateDate=null;
function localDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(x&&Array.isArray(x.habits)&&x.records&&typeof x.records==='object')state={...state,...x};if(!state.extras)state.extras={};if(!state.rewarded)state.rewarded={};if(!state.history)state.history={};if(!state.dayPhotos)state.dayPhotos={};if(!state.gems)state.gems=0;}}catch(e){}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save. Please export a backup when available.')}}function rec(k){if(!state.records[k])state.records[k]={};return state.records[k]}function dailyHabits(k){return [...state.habits,...((state.extras&&state.extras[k])||[])]}function pct(k){let hs=dailyHabits(k);if(state.history[k]&&typeof state.history[k].pct==='number')return state.history[k].pct;if(!hs.length)return 0;let r=state.records[k]||{};return hs.filter(h=>r[h.id]===true).length/hs.length}function isDone(k){if(state.history[k]&&typeof state.history[k].pct==='number')return state.history[k].pct===1;let hs=dailyHabits(k);return hs.length>0&&hs.every(h=>(state.records[k]||{})[h.id]===true)}function snapshot(k){let hs=dailyHabits(k);state.history[k]={total:hs.length,done:hs.filter(h=>(state.records[k]||{})[h.id]===true).length,pct:hs.length?hs.filter(h=>(state.records[k]||{})[h.id]===true).length/hs.length:0}}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}function render(){renderToday();renderStats();renderCalendar()}
function iconArt(h){
 const n=(h.name||'').toLowerCase(), e=h.emoji||'';
 let body='';
 if(n.includes('study')||n.includes('read')||e==='📚'||e==='📖'){
  body='<path d="M7 7.5c4-2 8-1 10 1v12c-2-2-6-3-10-1zM17 8.5c2-2 6-3 10-1v12c-4-2-8-1-10 1z"/><path d="M17 8.5v12"/>';
 }else if(n.includes('water')||e==='💧'){
  body='<path d="M17 4C14 9 9 14 9 19a8 8 0 0 0 16 0c0-5-5-10-8-15z"/>';
 }else if(n.includes('move')||n.includes('body')||n.includes('walk')||e.includes('🧘')){
  body='<path d="M5 13h4m14 0h4M9 9v8m14-8v8M9 11h14v4H9zM3 10v6m24-6v6"/>';
 }else if(n.includes('eat')||n.includes('food')||e==='🥗'){
  body='<path d="M5 14h24c-1 7-6 11-12 11S6 21 5 14z"/><path d="M9 11c0-3 4-3 4 0m2-2c0-4 5-4 5 0m2 2c0-3 4-3 4 0"/>';
 }else if(n.includes('sleep')||n.includes('night')||e==='🌙'){
  body='<path d="M22 5a11 11 0 1 0 7 17A10 10 0 0 1 22 5z"/>';
 }else{
  body='<path d="M17 4v26M4 17h26"/>';
 }
 return `<svg viewBox="0 0 34 34" width="30" height="30" fill="none" stroke="#242228" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}
function renderToday(){let today=localDateKey(new Date());document.getElementById('todayLabel').textContent=parseDate(today).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let hs=dailyHabits(selectedDate),r=rec(selectedDate),done=hs.filter(h=>r[h.id]===true).length,p=hs.length?done/hs.length:0;document.getElementById('countText').innerHTML=`<strong>${done} of ${hs.length}</strong> habits complete`;let path=document.getElementById('arcProgress'),length=path.getTotalLength();path.style.strokeDasharray=length;path.style.strokeDashoffset=length*(1-p);let monkey=document.getElementById('monkey');monkey.classList.toggle('sleepy',selectedDate===today&&done===0);if(selectedDate===today&&done===0)monkey.innerHTML=monkeyArt('sleepy');if(p===1&&hs.length){monkey.innerHTML=happyMonkey();if(celebrateDate===selectedDate){monkey.classList.add('celebrate');toast('You did it! One day at a time 🌷');celebrateDate=null;setTimeout(()=>monkey.classList.remove('celebrate'),1400)}}else{monkey.innerHTML=(selectedDate===today&&done===0)?monkeyArt('sleepy'):normalMonkey();monkey.classList.remove('celebrate')}
let list=document.getElementById('habitList');list.innerHTML='';if(!hs.length){list.innerHTML='<div class="tiny" style="padding:14px;text-align:center">No tasks today yet. Tap ＋ to add one.</div>'}hs.forEach(h=>{let yes=r[h.id]===true,el=document.createElement('div');el.className='habit'+(yes?' done':'');el.setAttribute('role','group');let photo=((state.dayPhotos&&state.dayPhotos[selectedDate])||{})[h.id]||'';let icon=photo?`<img src="${photo}" alt="Completion proof">`:iconArt(h);el.innerHTML=`<button class="habit-icon" type="button" aria-label="Upload proof photo">${icon}</button><input class="habit-photo-input" type="file" accept="image/*"><span class="habit-name">${esc(h.name)}</span><span class="check">${yes?'✓':''}</span>`;let photoBtn=el.querySelector('.habit-icon'),photoInput=el.querySelector('.habit-photo-input');photoBtn.onclick=ev=>{ev.stopPropagation();photoInput.click()};photoInput.onchange=async()=>{let f=photoInput.files&&photoInput.files[0];if(!f)return;if(f.size>1400000){toast('Choose a picture under 1.4 MB');return}let data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76))};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(f)});if(!state.dayPhotos)state.dayPhotos={};if(!state.gems)state.gems=0;if(!state.dayPhotos[selectedDate])state.dayPhotos[selectedDate]={};state.dayPhotos[selectedDate][h.id]=data;if(!rec(selectedDate)[h.id])toggle(h,false);else{snapshot(selectedDate);save();render()}};el.querySelector('.check').onclick=ev=>{ev.stopPropagation();toggle(h,yes)};el.onclick=ev=>{if(ev.target===el||ev.target.classList.contains('habit-name'))toggle(h,yes)};list.appendChild(el)});}

function normalMonkey(){return monkeyArt('neutral')}
function happyMonkey(){return monkeyArt('happy')}
function toggle(h,was){let wasComplete=isDone(selectedDate),r=rec(selectedDate);r[h.id]=!was;let rewardKey=selectedDate+'_'+h.id;if(!was&&!state.rewarded[rewardKey]){state.gems=(Number(state.gems)||0)+2;state.rewarded[rewardKey]=true}snapshot(selectedDate);if(!wasComplete&&isDone(selectedDate))celebrateDate=selectedDate;save();render();if(!was)document.getElementById('gems').textContent=state.gems}
function renderStats(){document.getElementById('gems').textContent=Number(state.gems)||0;let today=localDateKey(new Date()),cur=parseDate(today),streak=0;if(!isDone(today))cur.setDate(cur.getDate()-1);for(let i=0;i<500;i++){let k=localDateKey(cur);if(!isDone(k))break;streak++;cur.setDate(cur.getDate()-1)}document.getElementById('streak').textContent=streak;let keys=Object.keys(state.records).filter(k=>state.records[k]&&Object.values(state.records[k]).some(Boolean));let avg=keys.length?Math.round(keys.reduce((s,k)=>s+pct(k),0)/keys.length*100):0;document.getElementById('overall').textContent=avg+'%'}
function renderCalendar(){let first=new Date(viewYear,viewMonth,1),last=new Date(viewYear,viewMonth+1,0);document.getElementById('monthLabel').textContent=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});let cal=document.getElementById('calendar');cal.innerHTML='';['S','M','T','W','T','F','S'].forEach(d=>{let e=document.createElement('div');e.className='weekday';e.textContent=d;cal.appendChild(e)});for(let i=0;i<first.getDay();i++){let e=document.createElement('div');e.className='day empty';cal.appendChild(e)}let today=localDateKey(new Date());for(let n=1;n<=last.getDate();n++){let k=localDateKey(new Date(viewYear,viewMonth,n)),p=pct(k),e=document.createElement('button');e.className='day';e.textContent=n;if(k===today)e.classList.add('today');if(k===selectedDate)e.classList.add('selected');if(p===1)e.classList.add('complete');else if(p>=.51)e.classList.add('partial-high');else if(p>0)e.classList.add('partial-low');e.onclick=()=>{selectedDate=k;renderToday();renderCalendar();document.getElementById('selectedDayInfo').textContent=`Selected ${parseDate(k).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · ${Math.round(pct(k)*100)}% complete`};cal.appendChild(e)}document.getElementById('selectedDayInfo').textContent=`Selected ${parseDate(selectedDate).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · ${Math.round(pct(selectedDate)*100)}% complete`}
const modal=document.getElementById('modal'),body=document.getElementById('modalBody');let editorDraft=[];function openEditor(){document.getElementById('modalTitle').textContent='Edit daily habits';editorDraft=state.habits.map(h=>({...h}));drawEditor();modal.classList.remove('hidden')}function drawEditor(){
 body.innerHTML='<div class="tiny" style="margin-bottom:12px">These habits repeat every day. Add, rename, remove, or reorder your routine.</div><div id="editRows"></div><button class="btn secondary" id="addRecurring" type="button">＋ Add recurring habit</button>';
 let rows=document.getElementById('editRows');
 editorDraft.forEach((h,i)=>{
  let row=document.createElement('div');row.className='edit-row';
  row.innerHTML=`<span style="font-size:21px;width:34px;text-align:center">${iconArt(h)}</span><input type="text" data-hname="${i}" value="${esc(h.name)}" maxlength="55" aria-label="Habit name"><button class="mini" data-up="${i}" type="button" aria-label="Move up">↑</button><button class="mini" data-down="${i}" type="button" aria-label="Move down">↓</button><button class="task-remove" data-remove="${i}" aria-label="Remove habit">×</button>`;
  rows.appendChild(row);
 });
 rows.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{editorDraft.splice(+b.dataset.remove,1);drawEditor()});
 rows.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;if(i>0){[editorDraft[i-1],editorDraft[i]]=[editorDraft[i],editorDraft[i-1]];drawEditor()}});
 rows.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;if(i<editorDraft.length-1){[editorDraft[i+1],editorDraft[i]]=[editorDraft[i],editorDraft[i+1]];drawEditor()}});
 document.getElementById('addRecurring').onclick=()=>{editorDraft.push({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'New habit',emoji:'✧'});drawEditor()};
}
function saveEditor(){body.querySelectorAll('[data-hname]').forEach(inp=>{if(editorDraft[+inp.dataset.hname])editorDraft[+inp.dataset.hname].name=inp.value.trim()||'My habit'});Object.keys(state.records).forEach(k=>{if(!state.history[k])snapshot(k)});state.habits=editorDraft;save();modal.classList.add('hidden');render()}function openExtra(){document.getElementById('modalTitle').textContent='Add a task for today';body.innerHTML='<div class="tiny" style="margin-bottom:12px">This task is only for the selected date. It will not become a recurring habit.</div><div class="field"><label for="extraEmoji">ICON (EMOJI)</label><input id="extraEmoji" maxlength="8" value="✨"></div><div class="field"><label for="extraName">TASK NAME</label><input id="extraName" maxlength="55" placeholder="What do you want to do today?"></div>';document.getElementById('saveModal').onclick=()=>{let name=document.getElementById('extraName').value.trim();if(!name){toast('Add a task name first');return}if(!state.extras[selectedDate])state.extras[selectedDate]=[];state.extras[selectedDate].push({id:'x'+Date.now().toString(36),name,emoji:document.getElementById('extraEmoji').value.trim()||'✨'});save();modal.classList.add('hidden');document.getElementById('saveModal').onclick=saveEditor;render()};modal.classList.remove('hidden')}
document.getElementById('editBtn').onclick=openEditor;document.getElementById('plusBtn').onclick=openExtra;document.getElementById('cancelModal').onclick=()=>{modal.classList.add('hidden');document.getElementById('saveModal').onclick=saveEditor};document.getElementById('saveModal').onclick=saveEditor;modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.add('hidden');document.getElementById('saveModal').onclick=saveEditor}});document.getElementById('prevMonth').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}renderCalendar()};document.getElementById('nextMonth').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}renderCalendar()};document.getElementById('petsBtn').onclick=()=>toast('Pets collection is coming next 🐾');document.getElementById('toolsBtn').onclick=()=>toast('Tools are coming next ✨');
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='day-by-day-backup-'+localDateKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.habits)||!x.records)throw new Error('Invalid');if(confirm('Replace this preview’s data with the selected backup?')){state={...state,...x,dayPhotos:x.dayPhotos||{}};save();render();toast('Backup restored')}}catch(err){toast('That backup file could not be read')}e.target.value=''};load();let now=new Date();viewYear=now.getFullYear();viewMonth=now.getMonth();selectedDate=localDateKey(now);document.getElementById('saveModal').onclick=saveEditor;render();})();</script></body></html>
